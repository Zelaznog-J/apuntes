site_name: Apuntes de Ciencia de Datos Geoespaciales
site_description: Apuntes de Ciencia de Datos Geoespaciales
site_author: Javiera González Mardones
site_url: https://zelaznog-j.github.io/apuntes/
repo_url: https://github.com/Zelaznog-J/apuntes
repo_name: Zelaznog-J/apuntes
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: es
  font:
    text: Manrope
  palette:
    primary: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang: es
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      include_source: true
      ignore_h1_titles: true

nav:
  - Portafolio: https://zelaznog-j.github.io/
  - Inicio: index.md
  - GeoComputación con Python:
      - geocomputacion/index.md
      - 1. Datos geográficos y SRC: geocomputacion/01-datos-geograficos-y-src.md
